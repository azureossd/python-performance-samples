# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/cpu/cprofile_end"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/cpu/cprofile_initial"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/cpu/django-pyinstrument"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/cpu/pyinstrument_end"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/cpu/pyinstrument_initial"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/functions/v2"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/memory/flask-memory-profiler"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/memory/flask-tracemalloc-snapshot"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/memory/memory_profiler_end"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/memory/memory_profiler_initial"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/memory/tracemalloc_end"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/memory/tracemalloc_initial"
    schedule:
      interval: "weekly"
